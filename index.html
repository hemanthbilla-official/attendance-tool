<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Down</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: "Outfit", sans-serif;
        overflow: hidden;
        text-align: center;
      }
      .container {
        position: relative;
        z-index: 10;
      }
      img {
        max-width: 40vw;
        max-height: 40vh;
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
        margin-bottom: 2rem;
      }
      h1 {
        font-weight: 600;
        font-size: 2rem;
      }
      p {
        font-weight: 300;
        font-size: 1rem;
        color: #666;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.2em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="frustated-cat.webp" alt="frustrated cat" />
      <h1>Server is taking a nap.</h1>
    </div>
  </body>
</html>
